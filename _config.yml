title: "Charles Pourreau"
description: "Stratégie, modèles d'affaires et transformation par l'IA"
url: "https://charlespourreau.github.io"

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "default"

author:
  name: "Charles Pourreau"
  avatar: "/assets/images/portrait.jpg"
  bio: "Stratégie d'entreprise à l'ère de l'IA"
  location: "France"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
